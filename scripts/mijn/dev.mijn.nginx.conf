server {
    listen 80;
    listen [::]:80;
    server_name dev.mijn.amusing-hengelo.nl;
    location ^~ /.well-known/acme-challenge/ {
        alias /etc/letsencrypt/challenge/.well-known/acme-challenge/;
    }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dev.mijn.amusing-hengelo.nl;
    ssl_certificate /etc/letsencrypt/live/dev.mijn.amusing-hengelo.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.mijn.amusing-hengelo.nl/privkey.pem;
    access_log /home/groups/svp/dev.mijn.amusing-hengelo.nl/logs/access.log;
    error_log /home/groups/svp/dev.mijn.amusing-hengelo.nl/logs/error.log error;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 20m;
    location ^~ /.well-known/acme-challenge/ {
        alias /etc/letsencrypt/challenge/.well-known/acme-challenge/;
    }
    location / {
        proxy_pass http://127.0.0.1:5002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
    }
}
