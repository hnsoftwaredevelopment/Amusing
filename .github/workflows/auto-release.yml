name: Auto Release & Deploy from Main

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  release-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Generate version
      id: version
      run: |
        DATE=$(date +"%y.%m.%d")
        COUNT=$(git tag -l "$DATE.*" | wc -l)
        BUILD=$(printf "%02d" $((COUNT + 1)))
        VERSION="$DATE.$BUILD"
        echo "Generated version: $VERSION"
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Restore dependencies
      run: dotnet restore Amusing/Amusing.csproj --use-lock-file

    - name: Inject version into csproj
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        sed -i "s|<AssemblyVersion>.*</AssemblyVersion>|<AssemblyVersion>${VERSION}</AssemblyVersion>|" Amusing/Amusing.csproj
        sed -i "s|<FileVersion>.*</FileVersion>|<FileVersion>${VERSION}</FileVersion>|" Amusing/Amusing.csproj

    - name: Build & Publish
      run: |
        dotnet clean Amusing/Amusing.csproj
        dotnet build Amusing/Amusing.csproj --configuration Release
        dotnet publish Amusing/Amusing.csproj \
          --configuration Release \
          --runtime linux-x64 \
          --self-contained true \
          -o published

    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        printf "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh/config

    - name: Stop Blazor service
      run: ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
        "sudo systemctl stop amusing.service"

    - name: Deploy published folder (rsync)
      uses: burnett01/rsync-deployments@7.1.0
      with:
        switches: -avzr --delete --chmod=Du=rwx,Dg=rx,Do=rx,Fu=rw,Fg=r,Fo=r
        path: published/
        remote_path: /home/groups/svp/dev.beheer.amusing-hengelo.nl/www/Amusing
        remote_host: ${{ secrets.SSH_HOST }}
        remote_user: ${{ secrets.SSH_USER }}
        remote_key: ${{ secrets.SSH_KEY }}
        remote_port: ${{ secrets.SSH_PORT }}

    - name: Start Blazor service
      run: ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
        "sudo systemctl start amusing.service"

    - name: Optional: Clean old releases
      run: ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
        "find /home/groups/svp/dev.beheer.amusing-hengelo.nl/www/Amusing -maxdepth 1 -type d -mtime +30 -exec rm -rf {} \;"
