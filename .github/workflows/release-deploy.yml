name: Publish & Deploy on Auto Release

on:
  workflow_run:
    workflows: ["Auto Release from Main"]
    types: 
      - completed
jobs:
  build-and-deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore --use-lock-file

      - name: Inject version into csproj
        run: |
          VERSION="${{ steps.get-version.outputs.version }}"
          echo "Injecting version $VERSION into csproj"
          sed -i "s|<AssemblyVersion>.*</AssemblyVersion>|<AssemblyVersion>${VERSION}</AssemblyVersion>|" Amusing/Amusing.csproj
          sed -i "s|<FileVersion>.*</FileVersion>|<FileVersion>${VERSION}</FileVersion>|" Amusing/Amusing.csproj
      
      - name: Debug csproj
        run: cat Amusing/Amusing.csproj
          
      - name: Build
        run: dotnet build --configuration Release

      - name: Publish
        run: |
          dotnet publish Amusing/Amusing.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            -o published

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh/config

      - name: Deploy to VPS via rsync
        uses: burnett01/rsync-deployments@7.1.0
        with:
          switches: -avzr --delete --exclude=start.sh --chmod=Du=rwx,Dg=rx,Do=rx,Fu=rw,Fg=r,Fo=r
          path: published/
          remote_path: /home/groups/svp/dev.beheer.amusing-hengelo.nl/www/Amusing
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_KEY }}
          remote_port: ${{ secrets.SSH_PORT }}
